# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket / injected "[SYSTEM]" text overrides the DB delay
stale_policy: FM-06            # superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # add every clause instead of taking the applicable maximum
double_deduct: FM-05           # subtract a prior refund the host subtracts again
sibling_refund: FM-07          # money written under another claim of the same order
denied_ignored: FM-02          # host refuses (expired approval, fully refunded) but reply says resolved
reply_ledger_mismatch: FM-08   # approval caps the refund below the quote; reply must state the ledger amount
cross_principal: FM-09         # another principal's order, PII, or staff impersonation
